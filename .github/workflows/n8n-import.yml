name: Validate workflow in n8n engine

on:
  workflow_dispatch:

jobs:
  n8n-import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      N8N_USER_FOLDER: /tmp/ld-latte-n8n-ci
      N8N_ENCRYPTION_KEY: test-only-encryption-key-for-ci-1234567890
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install actual n8n 2.46.6 and SQLite driver
        run: |
          mkdir -p /tmp/ld-latte-n8n-engine
          cd /tmp/ld-latte-n8n-engine
          npm init -y >/dev/null
          npm install n8n@2.46.6 sqlite3@5.1.7 --no-audit --no-fund
      - name: Import exported workflow into isolated n8n DB
        run: |
          /tmp/ld-latte-n8n-engine/node_modules/.bin/n8n import:workflow --input="$GITHUB_WORKSPACE/n8n/dynamic-services.workflow.json"
      - name: Export stored workflows and inspect
        run: |
          /tmp/ld-latte-n8n-engine/node_modules/.bin/n8n export:workflow --all --output=/tmp/ld-latte-n8n-ci-export.json
          node -e "const x=require('/tmp/ld-latte-n8n-ci-export.json');const ws=Array.isArray(x)?x:[x];if(!ws.some(w=>w.name.includes('LD LATTE')&&w.nodes.length===8&&w.nodes.filter(n=>n.type==='n8n-nodes-base.telegram').length===3))process.exit(1);console.log('IMPORTED_AND_EXPORTED',ws.map(w=>w.name))"
